name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 librime-bin

      - name: Verify Rime package
        run: LUAC_BIN=luac5.4 ./scripts/verify.sh

      - name: Verify Windows installer entry point
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "rime-smart-simplified-windows"
          $output = ./scripts/install.ps1 -RimeUserDir $target -DryRun -NoDownloadGram
          $output | Write-Output
          if (-not ($output -match "Files to install:")) {
            throw "Windows installer dry run did not report its manifest."
          }
          if (-not ($output -match "rime_ice.schema.yaml")) {
            throw "Windows installer dry run omitted rime_ice.schema.yaml."
          }

  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the installer on Windows PowerShell
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP "rime-smart-simplified-windows-real"
          $output = .\scripts\install.ps1 -RimeUserDir $target -NoDownloadGram -NoDownloadPredict
          $output | Write-Output
          if (-not (Test-Path (Join-Path $target "rime_ice.schema.yaml"))) {
            throw "Windows installer did not produce rime_ice.schema.yaml."
          }
          if (-not (Test-Path (Join-Path $target "smart_chat_phrases.txt"))) {
            throw "Windows installer did not produce smart_chat_phrases.txt."
          }
