name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config lua5.4 librime-bin librime-dev

      - name: Verify Rime package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: LUAC_BIN=luac5.4 ./scripts/verify.sh

      - name: Verify release archive boundary
        run: ./scripts/check_release_archive.sh

      - name: Verify pinned upstream assets are fresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check_upstream_freshness.sh --strict

      - name: Verify Windows installer entry point
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "rime-smart-simplified-windows"
          $output = ./scripts/install.ps1 -RimeUserDir $target -DryRun -NoDownloadGram
          $output | Write-Output
          if (-not ($output -match "Files to install:")) {
            throw "Windows installer dry run did not report its manifest."
          }
          if (-not ($output -match "rime_ice.schema.yaml")) {
            throw "Windows installer dry run omitted rime_ice.schema.yaml."
          }

  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config lua5.4 librime-bin librime-dev

      - name: Run reproducible isolated benchmark
        run: |
          result="$RUNNER_TEMP/rime-smart-simplified-benchmark.jsonl"
          LUA_BIN=lua5.4 ./scripts/benchmark.sh --iterations 20 --output "$result"
          python3 - "$result" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              records = [json.loads(line) for line in fh if line.strip()]
          assert len(records) >= 6, len(records)
          assert records[0]["record"] == "run"
          assert any(r["record"] == "isolated_install_proxy" for r in records)
          assert any(r["record"] == "isolated_rime_build_proxy" for r in records)
          assert any(r["record"] == "librime_candidate_smoke_proxy" for r in records)
          assert all(r["accuracy_claim"] is False for r in records)
          assert all(r["proxy"] is True for r in records)
          print(f"benchmark_records={len(records)} accuracy_claim=false proxy=true")
          PY

  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the installer on Windows PowerShell
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP "rime-smart-simplified-windows-real"
          $output = .\scripts\install.ps1 -RimeUserDir $target -NoDownloadGram -NoDownloadPredict
          $output | Write-Output
          if (-not (Test-Path (Join-Path $target "rime_ice.schema.yaml"))) {
            throw "Windows installer did not produce rime_ice.schema.yaml."
          }
          if (-not (Test-Path (Join-Path $target "smart_chat_phrases.txt"))) {
            throw "Windows installer did not produce smart_chat_phrases.txt."
          }

      - name: Verify precise uninstall preserves edited files
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP "rime-smart-simplified-windows-uninstall"
          .\scripts\install.ps1 -RimeUserDir $target -NoDownloadGram -NoDownloadPredict
          $manifest = Join-Path $target ".rime-smart-simplified.install-manifest"
          $bytes = [System.IO.File]::ReadAllBytes($manifest)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "Windows ownership manifest unexpectedly contains a UTF-8 BOM."
          }
          Add-Content -LiteralPath (Join-Path $target "custom_phrase.txt") -Value "# CI private edit"
          $output = .\scripts\uninstall.ps1 -RimeUserDir $target -DryRun
          $output | Write-Output
          if (-not ($output -match "custom_phrase.txt")) {
            throw "Windows uninstall dry run did not inspect custom_phrase.txt."
          }
          .\scripts\uninstall.ps1 -RimeUserDir "$target\" -Apply
          if (-not (Test-Path (Join-Path $target "custom_phrase.txt"))) {
            throw "Windows uninstall removed an edited private phrase."
          }
          if (Test-Path (Join-Path $target "rime_ice.schema.yaml")) {
            throw "Windows uninstall left an unchanged package file."
          }
          if (-not (Test-Path $manifest)) {
            throw "Windows uninstall should retain the manifest while edited files remain."
          }

      - name: Verify hardlink and manifest tamper boundaries
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "rime-smart-simplified-windows-boundaries"
          $target = Join-Path $root "hardlink-target"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $outside = Join-Path $root "outside.yaml"
          Set-Content -LiteralPath $outside -Value "PRIVATE-HARDLINK-SENTINEL"
          New-Item -ItemType HardLink -Path (Join-Path $target "default.yaml") -Target $outside | Out-Null
          try {
            .\scripts\install.ps1 -RimeUserDir $target -NoDownloadGram -NoDownloadPredict
            throw "Installer unexpectedly overwrote a hard-linked file."
          } catch {
            if ($_.Exception.Message -notmatch "hard-linked file") {
              throw
            }
          }
          if ((Get-Content -Raw -LiteralPath $outside) -notmatch "PRIVATE-HARDLINK-SENTINEL") {
            throw "Hard-linked external file was modified."
          }

          $tamperTarget = Join-Path $root "tamper-target"
          .\scripts\install.ps1 -RimeUserDir $tamperTarget -NoDownloadGram -NoDownloadPredict
          $private = Join-Path $tamperTarget "private_user_file.txt"
          Set-Content -LiteralPath $private -Value "PRIVATE-TAMPER-SENTINEL"
          $sha = (Get-FileHash -LiteralPath $private -Algorithm SHA256).Hash.ToLowerInvariant()
          $entry = "file" + [char]9 + "private_user_file.txt" + [char]9 + $sha + [char]9 + $sha + [char]9 + "managed"
          Add-Content -LiteralPath (Join-Path $tamperTarget ".rime-smart-simplified.install-manifest") -Value $entry
          try {
            .\scripts\uninstall.ps1 -RimeUserDir $tamperTarget -Apply
            throw "Tampered manifest unexpectedly allowed deletion."
          } catch {
            if ($_.Exception.Message -notmatch "not installable|source hash mismatch") {
              throw
            }
          }
          if (-not (Test-Path -LiteralPath $private)) {
            throw "Tampered manifest removed a private file."
          }

  macos-rime:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verification tools
        run: brew install lua@5.4 pkgconf librime

      - name: Verify macOS package and real librime input boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LUA_PREFIX="$(brew --prefix lua@5.4)"
          export PATH="$LUA_PREFIX/bin:$PATH"
          echo "$LUA_PREFIX/bin" >> "$GITHUB_PATH"
          LUAC_BIN=luac5.4 LUA_BIN=lua5.4 ./scripts/verify.sh

  linux-frontends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fcitx5/IBus Rime frontends and deployer
        run: |
          sudo apt-get update
          sudo apt-get install -y ibus-rime fcitx5-rime librime-bin

      - name: Verify both Linux user-data paths build
        run: |
          set -euo pipefail
          for target in "$RUNNER_TEMP/fcitx5/rime" "$RUNNER_TEMP/ibus/rime"; do
            RIME_USER_DIR="$target" ./scripts/install.sh --no-download-gram --no-download-predict
            rime_deployer --build "$target" "$target" "$target/build"
            test -f "$target/build/rime_ice.schema.yaml"
          done

  upstream-freshness:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned upstream assets
        run: ./scripts/check_upstream_freshness.sh --strict
